name: build-tokenhelper

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TOOLS: "34.0.0"
      NDK_VER: "26.3.11579264"
      API: "31"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VER}" "platforms;android-34"

      - name: Generate NDK AIDL stubs and compile
        run: |
          set -euxo pipefail
          AIDL="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aidl"
          NDK="${ANDROID_HOME}/ndk/${NDK_VER}"
          CXX="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang++"
          test -x "$AIDL"
          test -x "$CXX"
          mkdir -p gen
          "$AIDL" --lang=ndk --structured --stability=vintf \
            -I aidl -o gen -h gen \
            aidl/vendor/xiaomi/hardware/aidl/midevauth/IMidevauthService.aidl
          echo "=== generated files ==="; find gen -type f
          "$CXX" -std=c++17 -O2 -Wall -fPIE -pie \
            -I gen \
            src/tokenhelper.cpp $(find gen -name '*.cpp') \
            -lbinder_ndk -llog \
            -o tokenhelper
          file tokenhelper || true
          "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h tokenhelper | head -20 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenhelper-arm64
          path: tokenhelper
          if-no-files-found: error
