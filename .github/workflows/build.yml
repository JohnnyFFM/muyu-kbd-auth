name: build-tokenhelper

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tokenhelper (arm64) with preinstalled SDK/NDK
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"; ls -1 "$SDK/build-tools" || true

          # newest build-tools that ships an aidl supporting --lang=ndk
          AIDL=""
          for d in $(ls -1 "$SDK/build-tools" | sort -rV); do
            if [ -x "$SDK/build-tools/$d/aidl" ]; then AIDL="$SDK/build-tools/$d/aidl"; break; fi
          done
          test -n "$AIDL"; echo "AIDL=$AIDL"

          # preinstalled NDK (fall back to any under $SDK/ndk)
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK="$(ls -d "$SDK"/ndk/* | sort -rV | head -1)"; fi
          echo "NDK=$NDK"; test -d "$NDK"
          CLANG="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/clang++ | head -1)"
          READELF="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          echo "CLANG=$CLANG"; test -x "$CLANG"

          mkdir -p gen
          "$AIDL" --lang=ndk --structured --stability=vintf \
            -I aidl -o gen -h gen \
            aidl/vendor/xiaomi/hardware/aidl/midevauth/IMidevauthService.aidl
          echo "=== generated ==="; find gen -type f

          "$CLANG" --target=aarch64-linux-android31 \
            -std=c++17 -O2 -Wall -fPIE -pie \
            -I gen \
            src/tokenhelper.cpp $(find gen -name '*.cpp') \
            -lbinder_ndk -llog \
            -o tokenhelper
          "$READELF" -h tokenhelper | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenhelper-arm64
          path: tokenhelper
          if-no-files-found: error
